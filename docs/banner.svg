<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="dictionary-kotlin: Kotlin client for the Free Dictionary API with a Wear OS dictionary" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151229"/>
      <stop offset="1" stop-color="#231c45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b9a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1936"/>
      <stop offset="1" stop-color="#110f1e"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3eefc"/>
      <stop offset="1" stop-color="#ddd3f5"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <!-- Faint letterforms in the background -->
  <g font-family="Georgia, 'DejaVu Serif', serif" fill="#ffffff" opacity="0.04">
    <text x="40" y="560" font-size="220" font-style="italic">Aa</text>
  </g>

  <!-- Title block -->
  <g font-family="'Inter', 'Helvetica Neue', 'DejaVu Sans', Arial, sans-serif">
    <text x="80" y="170" font-size="64" font-weight="700" fill="#f0edfa">dictionary-kotlin</text>
    <text x="82" y="222" font-size="26" fill="#b3adc8">Kotlin client for the Free Dictionary API,</text>
    <text x="82" y="258" font-size="26" fill="#b3adc8">with a Compose for Wear OS dictionary</text>

    <!-- Feature chips -->
    <g font-size="18" font-weight="600">
      <rect x="80" y="300" width="176" height="42" rx="21" fill="#3b2f72"/>
      <text x="168" y="327" text-anchor="middle" fill="#e6deff">Typed entries</text>
      <rect x="268" y="300" width="218" height="42" rx="21" fill="#3b2f72"/>
      <text x="377" y="327" text-anchor="middle" fill="#e6deff">Phonetics + audio</text>
      <rect x="498" y="300" width="136" height="42" rx="21" fill="#3b2f72"/>
      <text x="566" y="327" text-anchor="middle" fill="#e6deff">Synonyms</text>

      <rect x="80" y="356" width="226" height="42" rx="21" fill="#4d3810"/>
      <text x="193" y="383" text-anchor="middle" fill="#ffe7b8">Typed "not found"</text>
      <rect x="318" y="356" width="128" height="42" rx="21" fill="#4d3810"/>
      <text x="382" y="383" text-anchor="middle" fill="#ffe7b8">Caching</text>
      <rect x="458" y="356" width="196" height="42" rx="21" fill="#15463f"/>
      <text x="556" y="383" text-anchor="middle" fill="#c6f5ec">Wear OS sample</text>
    </g>
    <text x="82" y="450" font-size="18" fill="#7f78a0">Pure Kotlin/JVM · Coroutines · Ktor · JitPack</text>
  </g>

  <!-- Illustration: an open book behind a round watch -->
  <g transform="translate(720,110)">
    <!-- Book -->
    <g transform="translate(0,80)">
      <path d="M20 40 Q120 0 230 30 L230 270 Q120 240 20 280 Z" fill="url(#page)"/>
      <path d="M440 40 Q340 0 230 30 L230 270 Q340 240 440 280 Z" fill="url(#page)"/>
      <path d="M230 30 L230 270" stroke="#b9a6ff" stroke-width="4"/>
      <g stroke="#a99bd6" stroke-width="7" stroke-linecap="round" opacity="0.8">
        <line x1="60" y1="80" x2="190" y2="66"/>
        <line x1="60" y1="110" x2="200" y2="96"/>
        <line x1="60" y1="140" x2="170" y2="128"/>
        <line x1="60" y1="170" x2="196" y2="156"/>
        <line x1="270" y1="66" x2="400" y2="80"/>
        <line x1="270" y1="96" x2="390" y2="110"/>
      </g>
      <path d="M380 40 L380 110 L398 96 L416 110 L416 46" fill="#ffcf70"/>
    </g>

    <!-- Glow -->
    <circle cx="300" cy="170" r="230" fill="url(#glow)"/>

    <!-- Watch strap -->
    <rect x="240" y="-30" width="120" height="400" rx="34" fill="#2c2846"/>
    <rect x="252" y="-30" width="96" height="400" rx="28" fill="#36315a" opacity="0.6"/>
    <!-- Watch case -->
    <circle cx="300" cy="170" r="150" fill="#3a3558"/>
    <circle cx="300" cy="170" r="138" fill="url(#face)" stroke="#5a5480" stroke-width="3"/>
    <rect x="446" y="150" width="14" height="40" rx="6" fill="#4a4470"/>

    <!-- Watch screen: abstract dictionary UI -->
    <g font-family="Georgia, 'DejaVu Serif', serif">
      <text x="300" y="150" text-anchor="middle" font-size="58" font-style="italic" fill="#f0edfa">Aa</text>
    </g>
    <rect x="232" y="166" width="96" height="10" rx="5" fill="#b9a6ff"/>
    <!-- Play pronunciation button -->
    <circle cx="352" cy="171" r="16" fill="#b9a6ff"/>
    <path d="M344 166 L349 166 L355 160 L355 182 L349 176 L344 176 Z" fill="#22165a"/>
    <path d="M359 165 Q363 171 359 177" stroke="#22165a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Definition lines -->
    <rect x="210" y="196" width="180" height="8" rx="4" fill="#6a6488"/>
    <rect x="220" y="212" width="160" height="8" rx="4" fill="#6a6488"/>
    <!-- Chips -->
    <rect x="200" y="234" width="62" height="22" rx="11" fill="#3b2f72"/>
    <rect x="268" y="234" width="72" height="22" rx="11" fill="#3b2f72"/>
    <rect x="346" y="234" width="54" height="22" rx="11" fill="#4d3810"/>
    <!-- Page dots -->
    <circle cx="288" cy="276" r="4" fill="#b9a6ff"/>
    <circle cx="300" cy="276" r="3" fill="#6a6488"/>
    <circle cx="312" cy="276" r="3" fill="#6a6488"/>
  </g>
</svg>
