name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Test client (JSON fixtures, no network)
        run: ./gradlew :dictionary:test
      - name: Build sample
        run: ./gradlew :sample:assembleDebug
      - name: Verify publishing (what JitPack runs)
        run: ./gradlew publishToMavenLocal

  screenshots:
    name: README screenshots (live dictionary)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check that the Free Dictionary API answers from this runner
        # The screenshots show live entries only. If the API cannot be reached the job fails here, with a clear reason.
        run: curl -fsS --retry 3 --retry-delay 10 -o /dev/null -w "HTTP %{http_code}\n" "https://api.dictionaryapi.dev/api/v2/entries/en/serendipity"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build sample
        run: ./gradlew :sample:assembleDebug
      - name: Capture screenshots on a Wear OS emulator
        # Lookup, word detail, meanings pager and synonyms, each looked up live in api.dictionaryapi.dev.
        # A scene that cannot load (SCENE_FAILED) fails this step.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          disable-animations: true
          script: bash scripts/screenshots.sh
      - name: Commit screenshots
        run: |
          git config user.name "Halil Özel"
          git config user.email "halilozel1903@gmail.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi
