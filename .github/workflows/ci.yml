name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Test client (JSON fixtures, no network)
        run: ./gradlew :dictionary:test
      - name: Build sample
        run: ./gradlew :sample:assembleDebug
      - name: Verify publishing (what JitPack runs)
        run: ./gradlew publishToMavenLocal

  screenshots:
    name: README screenshots (live dictionary)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Pick the live source
        id: source
        # The screenshots show live entries only. The Free Dictionary API is used when it answers this runner; when
        # it refuses (its Cloudflare protection challenges GitHub's runners), Wiktionary's REST API is used instead.
        # If neither answers, the job fails here with a clear reason. Both use the library's own User-Agent.
        run: |
          ua="dictionary-kotlin/1.0.0 (+https://github.com/halilozel1903/dictionary-kotlin)"
          free="https://api.dictionaryapi.dev/api/v2/entries/en/serendipity"
          wiki="https://en.wiktionary.org/api/rest_v1/page/definition/serendipity"
          code=000
          for attempt in 1 2 3; do
            code=$(curl -sS -A "$ua" -D free-headers.txt -o /dev/null -w "%{http_code}" "$free" || echo 000)
            echo "Free Dictionary API, attempt $attempt: HTTP $code"
            [ "$code" = 200 ] && break
            sleep 10
          done
          if [ "$code" = 200 ]; then
            echo "source=freedictionary" >> "$GITHUB_OUTPUT"
            echo "reason=it answered this runner" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qi '^cf-mitigated: challenge' free-headers.txt; then
            why="api.dictionaryapi.dev answered GitHub's runner with a Cloudflare challenge (HTTP $code)"
          else
            why="api.dictionaryapi.dev answered GitHub's runner with HTTP $code"
          fi
          echo "$why"
          wcode=$(curl -sS -A "$ua" -o /dev/null -w "%{http_code}" "$wiki" || echo 000)
          echo "Wiktionary REST API: HTTP $wcode"
          if [ "$wcode" != 200 ]; then
            echo "::error::Neither the Free Dictionary API nor Wiktionary answered this runner"
            exit 1
          fi
          echo "source=wiktionary" >> "$GITHUB_OUTPUT"
          echo "reason=$why" >> "$GITHUB_OUTPUT"
      - name: Log what Wiktionary has for the scene words
        if: steps.source.outputs.source == 'wiktionary'
        run: |
          ua="dictionary-kotlin/1.0.0 (+https://github.com/halilozel1903/dictionary-kotlin)"
          mkdir -p wiktionary-check
          for word in serendipity light happy; do
            curl -sS -A "$ua" -o "wiktionary-check/$word.json" "https://en.wiktionary.org/api/rest_v1/page/definition/$word" || true
          done
          python3 - <<'PY'
          import json, re
          for word in ["serendipity", "light", "happy"]:
              try:
                  usages = json.load(open(f"wiktionary-check/{word}.json")).get("en", [])
              except Exception as e:
                  print(word, "unreadable:", e)
                  continue
              defs = [d.get("definition", "") for u in usages for d in u.get("definitions", [])]
              print(f"{word}: {len(usages)} English parts of speech {[u.get('partOfSpeech') for u in usages]}, "
                    f"{len(defs)} definitions, {sum(d.count('nyms synonym') for d in defs)} synonym lists, "
                    f"{sum(d.count('nyms antonym') for d in defs)} antonym lists")
              if defs:
                  print("  first definition:", defs[0][:400])
              nym = next((d for d in defs if "nyms synonym" in d), None)
              if nym:
                  i = nym.index("nyms synonym")
                  print("  synonym markup:", nym[max(0, i - 40):i + 400])
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build sample
        run: ./gradlew :sample:assembleDebug
      - name: Capture screenshots on a Wear OS emulator
        # Lookup, word detail, meanings pager and synonyms, each looked up live in api.dictionaryapi.dev.
        # A scene that cannot load (SCENE_FAILED) fails this step.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          disable-animations: true
          script: DICTIONARY_SOURCE=${{ steps.source.outputs.source }} bash scripts/screenshots.sh
      - name: Commit screenshots
        env:
          SOURCE: ${{ steps.source.outputs.source }}
          REASON: ${{ steps.source.outputs.reason }}
        run: |
          git config user.name "Halil Özel"
          git config user.email "halilozel1903@gmail.com"
          # Say in the README which live source these screenshots came from, and why.
          if [ "$SOURCE" = wiktionary ]; then
            line="The screenshots below came from **Wiktionary's REST API** (\`DictionarySource.Wiktionary\`), because $REASON, so the word screen has no phonetic or play button."
          else
            line="The screenshots below came from the **Free Dictionary API** (\`DictionarySource.FreeDictionary\`), the default source, because $REASON."
          fi
          python3 - "$line" <<'PY'
          import re, sys
          text = open("README.md", encoding="utf-8").read()
          new = re.sub(r"(<!-- screenshot-source -->\n).*?(\n<!-- /screenshot-source -->)", lambda m: m.group(1) + sys.argv[1] + m.group(2), text, flags=re.S)
          assert new != text or sys.argv[1] in text, "README has no screenshot-source markers"
          open("README.md", "w", encoding="utf-8").write(new)
          PY
          git add docs/screenshots README.md
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi
